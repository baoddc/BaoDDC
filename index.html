<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <!-- Quan trọng: Giúp giao diện chuẩn trên điện thoại -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kho Phôi cuộn</title>
  <style>
    /* Xóa khoảng trắng thừa của trình duyệt */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden; /* Bỏ thanh cuộn của trang chính */
    }

    /* Ép iframe tràn full toàn bộ màn hình */
    .full-screen-iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <iframe 
    src="https://web-supabase-five.vercel.app/pages/home.html"
    class="full-screen-iframe"
    title="Kho Phôi cuộn">
  </iframe>

</body>
</html>
